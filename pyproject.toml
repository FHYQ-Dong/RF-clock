[project]
name = "rf-clock"
version = "1.3.0.4"
description = "RF clock control library for Q-LATS Project. This library provides a Python interface for controlling the RF clock overlay on PYNQ platforms."
readme = "README.md"
authors = [
    { name = "Haoyu Dong", email = "h.dong@yale.edu" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy==1.21.5",
]

[dependency-groups]
dev = [
    "pynq==3.1.1",
    "pynqmetadata",
    "pynqutils",
    "pytest>=8.3",
]
# Plotting for utils/ only; not installed on the RFSoC (uv sync --no-default-groups).
plot = [
    "matplotlib",
    "plotly>=7.1.0",
]
# Lab instrument drivers (scope, EPG1) for tools/ only; not a dependency of the rf-clock
# package. From the Tanglab Gitea registry (yale.internal network).
instruments = [
    "tanglab-instruments[pyvisa-py]>=0.2.0",
]

[tool.uv]
default-groups = ["dev", "plot", "instruments"]

[[tool.uv.index]]
name = "tanglab"
url = "http://kinabalu2.stdusr.yale.internal/gitea/api/packages/Tanglab/pypi/simple/"
explicit = true  # only for the packages pinned to it below; everything else from PyPI

[tool.uv.sources]
pynqmetadata = { git = "https://github.com/Xilinx/PYNQ-Metadata.git" }
pynqutils = { git = "https://github.com/Xilinx/PYNQ-Utils.git" }
tanglab-instruments = { index = "tanglab" }

# Type checking (Pylance/pyright): the PL code and the board checks run on the
# board's Linux.
[tool.pyright]
pythonPlatform = "Linux"

[project.scripts]
rf-clock = "rf_clock:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
